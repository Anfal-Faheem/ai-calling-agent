<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Software Company - Aria Receptionist</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-ui, sans-serif;
    width: 100vw;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .card {
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(12px);
    width: 100%;
    max-width: 560px;
    margin-top: 0;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 4px;
    background: linear-gradient(90deg, transparent, #2563eb, transparent);
    animation: shimmer 3s infinite;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    z-index: 10;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .logo-container {
    text-align: center;
    margin-bottom: 16px;
    animation: float 4s ease-in-out infinite;
    position: relative;
    z-index: 1;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .logo-container img {
    max-width: 240px;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 4px 8px rgba(37, 99, 235, 0.4));
  }
  .company-tag {
    font-size: 14px; color: #94a3b8; margin-bottom: 20px; text-align: center; font-weight: 600;
    position: relative;
    z-index: 1;
  }
  .status {
    padding: 10px 14px;
    border-radius: 12px;
    margin: 14px 0;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.15);
    position: relative;
    z-index: 1;
  }
  .status.idle { background: rgba(15, 23, 42, 0.6); color: #94a3b8; }
  .status.listening { background: #166534; color: #dcfce7; border-color: #86efac; }
  .status.thinking { background: #1e40af; color: #dbeafe; border-color: #bfdbfe; }
  .status.speaking { background: #92400e; color: #fef3c7; border-color: #fcd34d; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #475569; flex-shrink: 0;
  }
  .dot.live { background: #22c55e; box-shadow: 0 0 12px #22c55e; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.45; } 100% { opacity: 1; } }
  .loader {
    display: inline-flex;
    gap: 4px;
    margin-left: 6px;
  }
  .loader span {
    width: 6px; height: 6px; background: #f8fafc; border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .loader span:nth-child(1) { animation-delay: -0.32s; }
  .loader span:nth-child(2) { animation-delay: -0.16s; }
  .loader span:nth-child(3) { animation-delay: 0s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }
  #transcript {
    background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
    padding: 14px; min-height: 56px; font-size: 16px; margin-bottom: 16px; text-align: center; color: #f8fafc;
    position: relative;
    z-index: 1;
  }
  .voice-box { margin: 14px 0; text-align: center; position: relative; z-index: 1; }
  .voice-box label {
    display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; font-weight: 600;
  }
  select {
    width: 100%; max-width: 300px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2); font-size: 15px; background: rgba(15, 23, 42, 0.6); color: #f8fafc;
    margin: 0 auto; display: block;
  }
  select option { background: #1e293b; color: #f8fafc; }
  .btn-start { width: 100%; margin: 0 auto 16px auto; display: block; position: relative; z-index: 1; }
  .btn-row { display: flex; gap: 10px; margin: 16px 0; position: relative; z-index: 1; }
  .btn-row button { flex: 1; min-width: 0; }
  button {
    background: #2563eb; color: #ffffff; border: none; padding: 14px 20px;
    border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all 0.2s ease;
  }
  button:hover { background: #3b82f6; transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:disabled { background: #475569; cursor: not-allowed; transform: none; }
  button.voice-on { background: #059669; }
  button.voice-on:hover { background: #047857; }
  button.end { background: #dc2626; }
  button.end:hover { background: #b91c1c; }
  button.secondary { background: #2563eb; }
  .test-box {
    margin-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    padding-top: 16px;
    text-align: center;
    display: none;
    position: relative;
    z-index: 1;
  }
  .test-box input {
    width: 72%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); font-size: 14px;
    background: rgba(15, 23, 42, 0.6); color: #f8fafc;
  }
  .test-box button { width: 24%; padding: 10px 0; font-size: 14px; }
  .saved {
    margin-top: 12px; padding: 10px; background: rgba(37, 99, 235, 0.15); border: 1px solid #86efac;
    border-radius: 10px; font-size: 13px; color: #86efac; display: none; text-align: center;
    position: relative; z-index: 1;
  }
  .note {
    margin-top: 20px;
    padding: 12px 16px;
    background: rgba(37, 99, 235, 0.1);
    border: 1px solid rgba(37, 99, 235, 0.3);
    border-radius: 10px;
    font-size: 13px;
    color: #93c5fd;
    text-align: center;
    position: relative;
    z-index: 1;
    overflow-wrap: break-word;
    word-wrap: break-word;
    line-height: 1.4;
  }
  @media (max-width: 480px) {
    .note {
      font-size: 12px;
      padding: 10px 14px;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo-container">
    <img id="companyLogo" src="logo.webp" alt="Virtual Software Company Logo" onerror="this.src='logo.png'; this.onerror=null;">
  </div>
  <p class="company-tag" id="agentDisplay">AI Receptionist: Aria</p>

  <button id="mainBtn" class="btn-start" onclick="toggleCall()">Start Call</button>

  <div id="status" class="status idle">
    <span class="dot" id="micDot"></span>Ready. Start your call.
  </div>

  <div id="transcript"></div>

  <div class="voice-box">
    <label for="voiceSelect">Choose Voice (Female / Girl):</label>
    <select id="voiceSelect"></select>
  </div>

  <div class="btn-row">
    <button id="voiceBtn" class="voice-off" onclick="toggleVoice()" disabled>Start Voice</button>
    <button class="secondary" onclick="toggleTextBox()">Send Text</button>
  </div>

  <div id="testBox" class="test-box">
    <input type="text" id="testInput" placeholder="Type your message...">
    <button onclick="testText()">Send</button>
  </div>

  <div id="savedBox" class="saved">✅ Appointment saved locally!</div>

  <div class="note">Ask me about Office hours, Services, Solutions, Company, Hiring and Appointments</div>
</div>

<script>
/* ============================================================
   COMPANY DETAILS
   ============================================================ */
const COMPANY_NAME = "Virtual Software Company";
const AGENT_NAME = "Aria";
const COMPANY_LOCATION = "4th Floor, Trade Center, G.T. Road, Gujranwala, Pakistan.";
const COMPANY_EMAIL = "hello@virtualsoftwarecompany.com";
const COMPANY_HOURS = "Monday to Friday, 9:00 AM to 6:00 PM Pakistan Time.";
const COMPANY_SERVICES = "Website Development, Custom Software, AI Automation, SEO & AI Search, and Digital Marketing.";
const COMPANY_SOLUTIONS = "Business Packages, Vimz AI Products, Complete Transformation, Overseas Business Growth, and Business Audit.";
const COMPANY_RESOURCES = "Insights and Guides & Tools.";
const COMPANY_PORTFOLIO = "Portfolio and Recognition are available.";

/* ============================================================ */

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;

let voices = [];
let recognition = null;
let isCalling = false;
let isVoiceActive = false;
let isProcessing = false;
let lastFinalText = "";
let booking = null;

const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const micDot = document.getElementById('micDot');
const mainBtn = document.getElementById('mainBtn');
const voiceBtn = document.getElementById('voiceBtn');
const voiceSelect = document.getElementById('voiceSelect');
const testInput = document.getElementById('testInput');
const savedBox = document.getElementById('savedBox');

function setStatus(cls, text, showLoader = false) {
  statusEl.className = 'status ' + cls;
  const dotHtml = (cls === 'listening')
    ? '<span class="dot live" id="micDot"></span>'
    : '<span class="dot" id="micDot"></span>';
  const loaderHtml = showLoader ? '<span class="loader"><span></span><span></span><span></span></span>' : '';
  statusEl.innerHTML = dotHtml + text + loaderHtml;
}

function log(msg) { console.log('[Receptionist]', msg); }

function populateVoices() {
  voices = synth.getVoices();
  voiceSelect.innerHTML = '';
  let targetIndex = -1;
  voices.forEach((v, i) => {
    const lang = (v.lang || '').toLowerCase();
    const isHindiIN = lang === 'hi-in' || lang.startsWith('hi-in');
    const option = document.createElement('option');
    option.value = i;
    option.textContent = `${v.name} (${v.lang})`;
    voiceSelect.appendChild(option);
    if (isHindiIN && targetIndex === -1) targetIndex = i;
  });
  if (targetIndex === -1) {
    voices.forEach((v, i) => {
      const name = v.name.toLowerCase();
      const isFemale =
        name.includes('female') || name.includes('woman') ||
        name.includes('samantha') || name.includes('victoria') ||
        name.includes('karen') || name.includes('hazel') ||
        name.includes('emma') || name.includes('zira') ||
        name.includes('susi') || name.includes('linda') ||
        name.includes('nicole');
      if (isFemale && targetIndex === -1) targetIndex = i;
    });
  }
  if (targetIndex !== -1) voiceSelect.value = targetIndex;
}
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = populateVoices;
populateVoices();

function speak(text) {
  if (synth.speaking) synth.cancel();
  isProcessing = true;
  setStatus('speaking', AGENT_NAME + " is speaking...", true);
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  u.pitch = 1.1;
  u.volume = 1.0;
  const sel = parseInt(voiceSelect.value);
  if (!isNaN(sel) && voices[sel]) u.voice = voices[sel];
  u.onend = () => {
    isProcessing = false;
    setStatus('idle', "Ready. Click Start Voice to speak.", false);
  };
  u.onerror = (e) => {
    log("TTS error: " + e.error);
    isProcessing = false;
    setStatus('idle', "Ready. Click Start Voice to speak.", false);
  };
  synth.speak(u);
}

/* ---------- Manual Voice Button ---------- */
function toggleVoice() {
  if (isVoiceActive) {
    stopVoice();
  } else {
    startVoice();
  }
}

function startVoice() {
  if (!SpeechRecognition) {
    setStatus('idle', "Speech recognition not supported. Use Chrome/Edge.", false);
    return;
  }
  if (isProcessing) return;

  isVoiceActive = true;
  voiceBtn.textContent = "Stop Voice";
  voiceBtn.className = "voice-on";
  voiceBtn.disabled = false;

  if (recognition) {
    try { recognition.stop(); } catch(e) {}
    recognition = null;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onspeechstart = () => {
    log("Speech started.");
    transcriptEl.textContent = "";
    setStatus('listening', "Listening... Speak now.", false);
  };

  recognition.onspeechend = () => {
    log("Silence detected.");
    setStatus('thinking', "Processing", true);
    try { recognition.stop(); } catch(e) {}
  };

  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript.trim();
    log("Recognized: " + text);
    transcriptEl.textContent = "You said: " + text;
    if (text && text !== lastFinalText) {
      lastFinalText = text;
      isVoiceActive = false;
      voiceBtn.textContent = "Start Voice";
      voiceBtn.className = "voice-off";
      handleUserInput(text);
    }
  };

  recognition.onerror = (e) => {
    log("Recognition error: " + e.error);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      setStatus('idle', "Microphone blocked. Click lock icon → Allow.", false);
      isVoiceActive = false;
      voiceBtn.textContent = "Start Voice";
      voiceBtn.className = "voice-off";
    } else if (e.error === 'no-speech') {
      log("No speech detected.");
      isVoiceActive = false;
      voiceBtn.textContent = "Start Voice";
      voiceBtn.className = "voice-off";
      setStatus('idle', "No voice detected. Click Start Voice again.", false);
    } else if (isVoiceActive) {
      setTimeout(() => startVoice(), 1000);
    }
  };

  recognition.onend = () => {
    recognition = null;
    if (isVoiceActive) {
      isVoiceActive = false;
      voiceBtn.textContent = "Start Voice";
      voiceBtn.className = "voice-off";
    }
  };

  try {
    recognition.start();
    log("Recognition started.");
  } catch (e) {
    log("Start error: " + e.message);
    isVoiceActive = false;
    voiceBtn.textContent = "Start Voice";
    voiceBtn.className = "voice-off";
  }
}

function stopVoice() {
  isVoiceActive = false;
  voiceBtn.textContent = "Start Voice";
  voiceBtn.className = "voice-off";
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
    recognition = null;
  }
  setStatus('idle', "Ready. Click Start Voice to speak.", false);
}

/* ---------- Text Box Toggle ---------- */
function toggleTextBox() {
  const box = document.getElementById('testBox');
  if (box.style.display === 'none' || box.style.display === '') {
    box.style.display = 'block';
    testInput.focus();
  } else {
    box.style.display = 'none';
  }
}

/* ---------- Call Control ---------- */
function endCall() {
  isCalling = false;
  isProcessing = false;
  isVoiceActive = false;
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
  if (synth.speaking) synth.cancel();
  mainBtn.textContent = "Start Call";
  mainBtn.className = "";
  mainBtn.onclick = toggleCall;
  voiceBtn.disabled = true;
  voiceBtn.textContent = "Start Voice";
  voiceBtn.className = "voice-off";
  setStatus('idle', "Call ended.", false);
  transcriptEl.textContent = "";
  lastFinalText = "";
  savedBox.style.display = 'none';
}

function toggleCall() {
  if (isCalling) {
    endCall();
  } else {
    isCalling = true;
    booking = null;
    mainBtn.textContent = "End Call";
    mainBtn.className = "end";
    mainBtn.onclick = toggleCall;
    voiceBtn.disabled = false;
    voiceBtn.textContent = "Start Voice";
    voiceBtn.className = "voice-off";
    speak("Thank you for calling " + COMPANY_NAME + ". This is " + AGENT_NAME + ". How can I help you today?");
  }
}

/* ---------- Brain (To the point) ---------- */
function getBrainReply(text) {
  const t = text.toLowerCase().trim();

  // Transfer to human
  if (t.includes('human') || t.includes('transfer') || t.includes('speak to a person') || t.includes('representative') || t.includes('agent')) {
    return { text: "Let me connect you with a member of our team at " + COMPANY_NAME + ".", action: 'transfer' };
  }

  // Office hours only
  if (t.includes('hour') || t.includes('open') || t.includes('time') || t.includes('schedule') || t.includes('when')) {
    return { text: "Our office hours are " + COMPANY_HOURS };
  }

  // Location / Company name only
  if (t.includes('where') || t.includes('location') || t.includes('address') || t.includes('situated') || t.includes('based') || t.includes('about') || t.includes('company') || t.includes('who are you') || t.includes('intro')) {
    return { text: "We are " + COMPANY_NAME + ", located at " + COMPANY_LOCATION };
  }

  // Contact / email only
  if (t.includes('contact') || t.includes('email') || t.includes('mail') || t.includes('phone') || t.includes('call') || t.includes('whatsapp')) {
    return { text: "You can email us at " + COMPANY_EMAIL + "." };
  }

  // Services only
  if (t.includes('service') || t.includes('offer') || t.includes('what do you do') || t.includes('development') || t.includes('software') || t.includes('marketing') || t.includes('seo') || t.includes('automation')) {
    return { text: "We offer " + COMPANY_SERVICES };
  }

  // Solutions only
  if (t.includes('solution') || t.includes('package') || t.includes('transformation') || t.includes('growth') || t.includes('audit') || t.includes('vimz')) {
    return { text: "Our solutions include " + COMPANY_SOLUTIONS };
  }

  // Resources only
  if (t.includes('resource') || t.includes('insight') || t.includes('guide') || t.includes('tool')) {
    return { text: "We provide " + COMPANY_RESOURCES };
  }

  // Portfolio / Recognition only
  if (t.includes('portfolio') || t.includes('recognition') || t.includes('work')) {
    return { text: COMPANY_PORTFOLIO };
  }

  // Hiring / Jobs / Career
  if (t.includes('hire') || t.includes('hiring') || t.includes('job') || t.includes('career') || t.includes('join') || t.includes('talent') || t.includes('opening') || t.includes('recruit') || t.includes('employment') || t.includes('work with us')) {
    return { text: "We are always looking for talented people to join our team. We will have openings soon. Would you like to book an appointment to discuss opportunities?" };
  }

  // Start booking
  if (t.includes('appointment') || t.includes('book') || t.includes('schedule a meeting') || t.includes('booking')) {
    booking = { step: 'name', data: {} };
    return { text: "I'd be happy to help you book an appointment with " + COMPANY_NAME + ". May I have your full name, please?" };
  }

  // Booking flow steps
  if (booking) {
    if (booking.step === 'name') {
      booking.data.name = text;
      booking.step = 'email';
      return { text: "Thank you. What is your email address?" };
    }
    if (booking.step === 'email') {
      booking.data.email = text;
      booking.step = 'date';
      return { text: "Got it. What is your preferred date?" };
    }
    if (booking.step === 'date') {
      booking.data.date = text;
      booking.step = 'time';
      return { text: "And what time would you prefer?" };
    }
    if (booking.step === 'time') {
      booking.data.time = text;
      booking.step = 'purpose';
      return { text: "Lastly, what is the purpose of your visit?" };
    }
    if (booking.step === 'purpose') {
      booking.data.purpose = text;
      const appts = JSON.parse(localStorage.getItem('vsc_appointments') || '[]');
      appts.push({ ...booking.data, bookedAt: new Date().toISOString(), company: COMPANY_NAME });
      localStorage.setItem('vsc_appointments', JSON.stringify(appts));
      const done = booking;
      booking = null;
      savedBox.style.display = 'block';
      return { text: "Thank you, " + done.data.name + ". Your appointment has been booked with " + COMPANY_NAME + ". We look forward to seeing you." };
    }
  }

  // Default fallback: off-topic or detailed question -> transfer
  return { text: "I am an assistant, I provide general information. For more details, let me transfer you to our team at " + COMPANY_NAME + ".", action: 'transfer' };
}

async function handleUserInput(text) {
  if (isProcessing) return;
  isProcessing = true;
  setStatus('thinking', "Processing", true);
  const reply = getBrainReply(text);
  log("AI: " + JSON.stringify(reply));
  if (reply.action === 'transfer') {
    setStatus('speaking', "Transferring to human...", true);
    speak(reply.text);
    endCall();
    return;
  }
  speak(reply.text);
}

function testText() {
  const text = testInput.value.trim() || "hello";
  log("Test text: " + text);
  transcriptEl.textContent = "You typed: " + text;
  handleUserInput(text);
}
</script>

</body>
</html>
